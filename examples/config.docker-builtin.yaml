# Copy this file to ./config.yaml and replace every example hostname and key
# before starting Compose. The Relay name map must remain YAML; do not try to
# encode relay-wss-urls in an environment variable.
lang: "zh-CN"

app:
  web-client: 0
  register: false
  register-status: 1
  captcha-threshold: 3
  ban-threshold: 0
  show-swagger: 0
  token-expire: 168h
  web-sso: true
  disable-pwd-login: false

web-client:
  mode: "builtin"
  listen: "0.0.0.0:21122"
  public-origin: "https://client.example.com"
  api-origin: "https://api.example.com"
  rendezvous-wss-url: "wss://rustdesk.example.com/ws/id"
  # Keys are the exact Relay names returned by rendezvous. Values are the only
  # WSS Relay destinations that the browser is permitted to contact.
  relay-wss-urls:
    "rustdesk.example.com:21117": "wss://rustdesk.example.com/ws/relay"
  server-public-key: "REPLACE_WITH_BASE64_32_BYTE_ED25519_PUBLIC_KEY"
  profile-generation: 1
  connection-token-ttl: 15m

admin:
  title: "Kessoku Admin"
  hello-file: "./conf/admin/hello.html"
  id-server-port: 21116
  relay-server-port: 21117

gin:
  api-addr: "0.0.0.0:21114"
  mode: "release"
  resources-path: "resources"
  trust-proxy: ""

gorm:
  type: "sqlite"
  max-idle-conns: 10
  max-open-conns: 100

rustdesk:
  # Compose overrides these scalar values from .env. They remain here so Viper
  # has explicit typed keys while decoding the mounted configuration.
  id-server: "rustdesk.example.com:21116"
  relay-server: "rustdesk.example.com:21117"
  api-server: "https://api.example.com"
  key: ""
  key-file: ""
  personal: 1

logger:
  path: "./runtime/log.txt"
  level: "info"
  report-caller: true

proxy:
  enable: false

auth:
  enabled: true
  issuer: "https://api.example.com"
  # RustDesk 1.4.9 keeps one standard login token for both API calls and
  # signalling. The built-in Web Client never receives that standard token;
  # login/grant endpoints return a connection-only token instead.
  audiences:
    - "kessoku-api"
    - "rustdesk-connect"
  access-token-ttl: 168h
  maximum-token-ttl: 168h
  clock-skew: 30s
  max-token-bytes: 8192
  legacy-token-read-enabled: false
  current-key:
    id: "kessoku-2026-01"
    private-key-file: "/run/secrets/kessoku-access-ed25519.pem"
  previous-keys: []
  internal:
    enabled: false
    listen: "127.0.0.1:21121"

server-control:
  legacy-command-enabled: false
  read-only: true
  request-timeout: 5s
  response-max-bytes: 1048576
  instances: []

ldap:
  enable: false
