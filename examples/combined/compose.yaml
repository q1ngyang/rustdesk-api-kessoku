# Recommended single-host Kessoku + Starry HBBS/HBBR stack for Linux.
# Starry uses host networking so HBBS sees the real peer address. Kessoku's
# HTTP listeners are published only on host loopback and must be served by TLS.
name: ${COMPOSE_PROJECT_NAME:-rustdesk-kessoku-starry}

services:
  hbbs:
    image: ${STARRY_IMAGE:-ghcr.io/q1ngyang/rustdesk-server-starry}:${STARRY_VERSION:-1.1.16-patch-v1.2.0}
    container_name: rustdesk-starry-hbbs
    command:
      - hbbs
      - --starry-config=/etc/starry/config.yaml
    environment:
      RUST_LOG: ${RUSTDESK_LOG_LEVEL:-info}
    volumes:
      - type: bind
        source: ${STARRY_DATA_DIR:-./data/starry}
        target: /root
      - type: bind
        source: ${STARRY_CONFIG_FILE:-./starry-config.yaml}
        target: /etc/starry/config.yaml
        read_only: true
    network_mode: host
    restart: ${STARRY_RESTART_POLICY:-unless-stopped}
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /root/id_ed25519 &&
          test -s /root/id_ed25519.pub &&
          nc -w 2 127.0.0.1 21116 </dev/null
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  hbbr:
    image: ${STARRY_IMAGE:-ghcr.io/q1ngyang/rustdesk-server-starry}:${STARRY_VERSION:-1.1.16-patch-v1.2.0}
    container_name: rustdesk-starry-hbbr
    command:
      - hbbr
      - -k
      - _
    environment:
      RUST_LOG: ${RUSTDESK_LOG_LEVEL:-info}
    volumes:
      - type: bind
        source: ${STARRY_DATA_DIR:-./data/starry}
        target: /root
    network_mode: host
    depends_on:
      hbbs:
        condition: service_healthy
    restart: ${STARRY_RESTART_POLICY:-unless-stopped}
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  kessoku-api:
    image: ${KESSOKU_IMAGE:-ghcr.io/q1ngyang/rustdesk-api-kessoku:v3.0.1}
    container_name: rustdesk-api-kessoku
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RUSTDESK_API_LANG: ${KESSOKU_LANG:-zh-CN}
      RUSTDESK_API_RUSTDESK_ID_SERVER: ${RUSTDESK_DOMAIN:?set RUSTDESK_DOMAIN}:21116
      RUSTDESK_API_RUSTDESK_RELAY_SERVER: ${RUSTDESK_DOMAIN:?set RUSTDESK_DOMAIN}:21117
      RUSTDESK_API_RUSTDESK_API_SERVER: ${KESSOKU_PUBLIC_URL:?set KESSOKU_PUBLIC_URL}
      RUSTDESK_API_RUSTDESK_KEY: ${RUSTDESK_SERVER_PUBLIC_KEY:?set RUSTDESK_SERVER_PUBLIC_KEY}
      RUSTDESK_API_GIN_TRUST_PROXY: ${KESSOKU_TRUST_PROXY:-}
    ports:
      - ${KESSOKU_BIND_ADDRESS:-127.0.0.1}:${KESSOKU_API_PORT:-21114}:21114
      - ${KESSOKU_CLIENT_BIND_ADDRESS:-127.0.0.1}:${KESSOKU_CLIENT_PORT:-21122}:21122
    volumes:
      - ${KESSOKU_DATA_DIR:-./data/kessoku}:/app/data
      - ${KESSOKU_SECRETS_DIR:-./secrets/kessoku}:/run/secrets:ro
      - ${KESSOKU_CONFIG_FILE:-./kessoku-config.yaml}:/app/conf/config.yaml:ro
    tmpfs:
      - /app/runtime:uid=65534,gid=65534,mode=0700
    depends_on:
      hbbs:
        condition: service_healthy
