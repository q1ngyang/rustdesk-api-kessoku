# Starry HBBS single-host profile used by the combined tutorial.
# Replace every example.com hostname before starting HBBS.
version: 3

relay_servers:
  - rustdesk.example.com:21117

secure_tcp:
  mode: auto
  handshake_timeout_ms: 18000
  idle_timeout_ms: 30000
  max_frame_bytes: 65536

# Required by Kessoku's built-in browser client. Nginx must publish the exact
# /ws/id and /ws/relay paths with a certificate trusted by browsers.
websocket_signal:
  enabled: true
  registration_timeout_ms: 10000
  keepalive_interval_ms: 12000
  idle_timeout_ms: 45000
  max_frame_bytes: 65536
  outbound_queue_capacity: 64
  max_sessions: 10000
  max_sessions_per_effective_ip: 512
  registration_rate_per_minute: 300
  trusted_proxies:
    - 127.0.0.1/32
    - ::1/128
  allowed_origins:
    - https://client.example.com
  relay_health:
    interval_seconds: 60
    timeout_ms: 5000
    success_threshold: 1
    failure_threshold: 2
    endpoints:
      - relay: rustdesk.example.com:21117
        url: wss://rustdesk.example.com/ws/relay

# Start with off. Follow the connection-authentication guide and spend a full
# validation period in audit before changing this to enforce.
connection_auth:
  mode: off

# The image contains no licensed MMDB. Add lawful files/URLs before enabling
# Geo rules. The catch-all rule keeps this single Relay usable afterwards.
mmdb:
  update_interval_hours: 168
  update_on_start: false
  force_update: false
  download_timeout_seconds: 600
  minimum_bytes: 65536
  country:
    path: mmdb/GeoLite2-Country.mmdb
    url: ""
  city:
    path: mmdb/GeoLite2-City.mmdb
    url: ""
  asn:
    path: mmdb/GeoLite2-ASN.mmdb
    url: ""

geo:
  enabled: false
  rules:
    - name: Default Relay
      symmetric: true
      match:
        client_a: "*"
        client_b: "*"
      relays:
        - rustdesk.example.com:21117
