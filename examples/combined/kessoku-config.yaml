# Replace every example.com hostname and the public key before starting
# kessoku-api. Secrets are referenced as files under /run/secrets.
lang: "zh-CN"

app:
  web-client: 0
  register: false
  register-status: 1
  captcha-threshold: 3
  ban-threshold: 10
  show-swagger: 0
  token-expire: 168h
  web-sso: true
  disable-pwd-login: false

web-client:
  mode: "builtin"
  listen: "0.0.0.0:21122"
  public-origin: "https://client.example.com"
  api-origin: "https://api.example.com"
  rendezvous-wss-url: "wss://rustdesk.example.com/ws/id"
  # The key must exactly match the Relay name returned by Starry HBBS.
  relay-wss-urls:
    "rustdesk.example.com:21117": "wss://rustdesk.example.com/ws/relay"
  server-public-key: "REPLACE_WITH_DATA_STARRY_ID_ED25519_PUB"
  profile-generation: 1
  connection-token-ttl: 15m

media:
  directory: "./data/media"
  max-image-bytes: 1048576

two-factor:
  enabled: true
  issuer: "RustDesk API Kessoku"
  key-file: "./data/totp.key"
  challenge-ttl: 5m

admin:
  title: "Kessoku 管理后台"
  hello-file: "./conf/admin/hello.html"
  id-server-port: 21116
  relay-server-port: 21117

gin:
  api-addr: "0.0.0.0:21114"
  mode: "release"
  resources-path: "resources"
  trust-proxy: ""

gorm:
  type: "sqlite"
  max-idle-conns: 10
  max-open-conns: 100

rustdesk:
  # Compose overrides these four scalar values from .env.
  id-server: "rustdesk.example.com:21116"
  relay-server: "rustdesk.example.com:21117"
  api-server: "https://api.example.com"
  key: ""
  key-file: ""
  personal: 1

logger:
  path: "./runtime/log.txt"
  level: "info"
  report-caller: false
  max-size-mb: 20
  max-backups: 5
  max-age-days: 14
  compress: true
  local-time: true

proxy:
  enable: false

auth:
  enabled: true
  issuer: "https://api.example.com"
  audiences:
    - "kessoku-api"
    - "rustdesk-connect"
  access-token-ttl: 168h
  maximum-token-ttl: 168h
  clock-skew: 30s
  max-token-bytes: 8192
  legacy-token-read-enabled: false
  current-key:
    id: "kessoku-main-2026"
    private-key-file: "/run/secrets/kessoku-access-ed25519.pem"
  previous-keys: []
  internal:
    enabled: false
    listen: "127.0.0.1:21121"

server-control:
  legacy-command-enabled: false
  read-only: true
  request-timeout: 5s
  response-max-bytes: 1048576
  # logger.path is listed automatically. To show Starry/Relay files too, have
  # the deployment log collector write them into one mounted directory, set
  # that absolute in-container directory here, and allowlist simple filenames.
  log-directory: ""
  log-sources: []
  # Persist the independent SP1 registry with /app/data. Enable only after
  # pinning the Broker certificate and pre-approving exact Agent origins.
  registry-directory: "/app/data/server-control"
  host-identity-file: "/run/kessoku-host-machine-id"
  pairing:
    enabled: false
    broker-origin: ""
    broker-spki-sha256: ""
    code-ttl: 10m
    recovery-ttl: 10m
    agent-origins: []
  instances: []

ldap:
  enable: false
