lang: "zh-CN"
app:
  web-client: 0  # 已移除的兼容键；非 0 会拒绝启动
  register: false #是否开启注册
  register-status: 1 # 注册用户默认状态 1:启用 2:禁用
  captcha-threshold: 3 #   <0:disabled, 0 always, >0:enabled
  ban-threshold: 0 # 0:disabled, >0:enabled
  show-swagger: 0 # 1:启用 0:禁用
  token-expire: 168h
  web-sso: true #web auth sso
  disable-pwd-login: false #禁用密码登录

# Repository-owned browser client. It is built into the same image but must be
# exposed on an HTTPS origin distinct from the API/admin origin.
web-client:
  mode: "disabled" # disabled | builtin
  listen: "0.0.0.0:21122"
  public-origin: "https://client.example.com"
  api-origin: "https://api.example.com"
  rendezvous-wss-url: "wss://rustdesk.example.com/ws/id"
  relay-wss-urls:
    "rustdesk.example.com:21117": "wss://rustdesk.example.com/ws/relay"
  server-public-key: "" # 32-byte Ed25519 public key encoded with base64
  profile-generation: 0
  connection-token-ttl: 15m

# Persistent raster assets used by deployment branding and user avatars.
media:
  directory: "./data/media"
  max-image-bytes: 1048576

# RFC 6238 TOTP. The 32-byte encryption key is generated with mode 0600 on
# first startup and must be included in /app/data backups.
two-factor:
  enabled: true
  issuer: "RustDesk API Kessoku"
  key-file: "./data/totp.key"
  challenge-ttl: 5m

admin:
  title: "Kessoku Admin"
  hello-file: "./conf/admin/hello.html"  #优先使用file
  hello: ""
  # ID Server and Relay Server ports https://github.com/lejianwen/rustdesk-api/issues/257
  id-server-port: 21116  # ID Server port (for server cmd)
  relay-server-port: 21117 # ID Server port (for server cmd)
gin:
  api-addr: "0.0.0.0:21114"
  mode: "release" #release,debug,test
  resources-path: 'resources'  #对外静态文件目录
  trust-proxy: ""
gorm:
  type: "sqlite"
  max-idle-conns: 10
  max-open-conns: 100
mysql:
  username: ""
  password: ""
  addr: ""
  dbname: ""
  tls: "true" # MySQL deployments require certificate-verified TLS
  ca-file: "" # optional additional CA bundle for private database PKI

postgresql:
  host: "127.0.0.1"
  port: "5432"
  user: ""
  password: ""
  dbname: "postgres"
  sslmode: "verify-full" # PostgreSQL deployments require certificate and hostname verification
  ssl-root-cert: "" # optional CA bundle path for private database PKI
  time-zone: "Asia/Shanghai" # Time zone for PostgreSQL connection

rustdesk:
  id-server: "192.168.1.66:21116"
  relay-server: "192.168.1.66:21117"
  api-server: "http://127.0.0.1:21114"
  key: ""
  key-file: "/data/id_ed25519.pub"
  personal: 1
logger:
  path: "./runtime/log.txt"
  level: "info" #trace,debug,info,warn,error,fatal
  report-caller: true
proxy:
  enable: false # must remain false; OAuth/OIDC proxy mode is rejected
  host: "http://127.0.0.1:1080"
# Ed25519 access-token profile. Keep disabled only during the one-time opaque
# token migration window; connection-auth audit/enforce requires it enabled.
auth:
  enabled: false
  issuer: "https://api.example.com"
  audiences:
    - "kessoku-api"
    - "rustdesk-connect"
  # RustDesk clients currently retain a single long-lived login token and do
  # not implement an access-token refresh flow.
  access-token-ttl: 168h
  maximum-token-ttl: 168h
  clock-skew: 30s
  max-token-bytes: 8192
  legacy-token-read-enabled: false
  current-key:
    id: "kessoku-2026-01"
    private-key-file: "/run/secrets/kessoku-access-ed25519.pem"
  previous-keys: []
  internal:
    enabled: false
    listen: "127.0.0.1:21121"
    server-cert-file: "/run/secrets/kessoku-internal-server.pem"
    server-key-file: "/run/secrets/kessoku-internal-server-key.pem"
    client-ca-file: "/run/secrets/starry-client-ca.pem"
    allowed-uri-sans:
      - "spiffe://example.com/starry/production"
    allowed-dns-sans: []
    max-body-bytes: 1048576
    request-timeout: 2s
    global-requests-per-second: 200
    per-cert-requests-per-second: 100

# Removed HS256 compatibility keys are intentionally not supported. Existing
# jwt.* values, if present in an older deployment file, are ignored.

# Typed Starry control plane. Instances are fixed by deployment configuration;
# the browser cannot submit an Agent URL. Credential values are file references.
server-control:
  legacy-command-enabled: false
  read-only: true
  request-timeout: 5s
  response-max-bytes: 1048576
  # Optional allowlist of deployment-owned files exposed by the bounded,
  # redacting log viewer. Files must be simple names under this directory.
  log-directory: ""
  log-sources: []
  instances: []
ldap:
  enable: false
  url: "ldaps://ldap.example.com:636"
  tls-ca-file: "/run/secrets/ldap-ca.pem"
  tls-verify: true
  base-dn: "dc=example,dc=com"
  bind-dn: "cn=admin,dc=example,dc=com"
  bind-password: ""

  user:
    base-dn: "ou=users,dc=example,dc=com"
    enable-attr: ""       #The attribute name of the user for enabling, in AD it is "userAccountControl", empty means no enable attribute, all users are enabled
    enable-attr-value: "" # The value of the enable attribute when the user is enabled. If you are using AD, just set random value, it will be ignored.
    filter: "(cn=*)"
    username: "uid"       # The attribute name of the user for usernamem if you are using AD, it should be "sAMAccountName"
    email: "mail"
    first-name: "givenName"
    last-name: "sn"
    sync: false         # If true, the user will be synchronized to the database when the user logs in. If false, the user will be synchronized to the database when the user be created.
    admin-group: "cn=admin,dc=example,dc=com" # The group name of the admin group, if the user is in this group, the user will be an admin.
    allow-group: "cn=users,dc=example,dc=com" # The group name of the users group, if the user is in this group, the user will be an login. 
