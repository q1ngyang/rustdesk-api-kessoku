name: Prepare or publish approved Kessoku candidate
run-name: Kessoku ${{ inputs.mode }} ${{ inputs.release_tag }} from candidate run ${{ inputs.candidate_run_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Prepare the immutable tag, or publish the prepared tag"
        required: true
        type: choice
        options:
          - prepare
          - publish
      release_tag:
        description: "Approved semantic version recorded in RELEASE_STATUS"
        required: true
        type: string
      candidate_run_id:
        description: "Successful pre-tag candidate workflow run ID for this exact commit"
        required: true
        type: string

concurrency:
  group: kessoku-release-${{ inputs.release_tag }}-${{ inputs.mode }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rustdesk-api-kessoku
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  publish:
    name: Verify, attest, and ${{ inputs.mode }} approved candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: kessoku-release
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce mode, approval, and exact successful candidate run
        id: guard
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$RELEASE_MODE" | grep -Eq '^(prepare|publish)$'
          status="$(sed -n 's/^status: //p' RELEASE_STATUS)"
          release_tag="$(sed -n 's/^release_tag: //p' RELEASE_STATUS)"
          keys="$(sed -n 's/^\([a-z_]*\): .*/\1/p' RELEASE_STATUS | LC_ALL=C sort | tr '\n' ' ')"
          test "$keys" = "release_tag status "
          test "$status" = APPROVED
          printf '%s' "$release_tag" \
            | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$'
          test "$release_tag" = "$REQUESTED_RELEASE_TAG"
          candidate_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" --jq .head_sha)"
          printf '%s' "$candidate_sha" | grep -Eq '^[0-9a-f]{40}$'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" --jq .event)" = workflow_dispatch
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" --jq .path)" = .github/workflows/build.yml
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" --jq .head_branch)" = master

          verify_remote_annotated_tag() {
            local tag_object_sha
            test "$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" \
              --jq .object.type)" = tag
            tag_object_sha="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" \
              --jq .object.sha)"
            printf '%s' "$tag_object_sha" | grep -Eq '^[0-9a-f]{40}$'
            test "$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq .tag)" = "$release_tag"
            test "$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq .object.type)" = commit
            test "$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq .object.sha)" = "$candidate_sha"
          }

          if [ "$RELEASE_MODE" = prepare ]; then
            test "${GITHUB_REF_TYPE}" = branch
            test "${GITHUB_REF_NAME}" = master
            test "$candidate_sha" = "$GITHUB_SHA"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" \
              >/dev/null 2>&1; then
              verify_remote_annotated_tag
              echo "resuming the exact prepared tag: $release_tag"
            fi
          else
            if [ "${GITHUB_REF_TYPE}" = tag ]; then
              test "$release_tag" = "${GITHUB_REF_NAME}"
              test "$candidate_sha" = "$GITHUB_SHA"
            else
              test "${GITHUB_REF_TYPE}" = branch
              test "${GITHUB_REF_NAME}" = master
              if [ "$candidate_sha" != "$GITHUB_SHA" ]; then
                git merge-base --is-ancestor "$candidate_sha" "$GITHUB_SHA"
                while IFS= read -r changed_path; do
                  case "$changed_path" in
                    .github/workflows/release.yml | \
                    docs/releases/RELEASE-CHECKLIST.md | \
                    docs/releases/RELEASE-PROCESS.md | \
                    supply_chain_policy_test.go)
                      ;;
                    *)
                      echo "::error::publish recovery contains a non-release change: ${changed_path}"
                      exit 1
                      ;;
                  esac
                done < <(git diff --name-only "${candidate_sha}..${GITHUB_SHA}")
                echo "using reviewed release-plumbing recovery from protected master"
              fi
            fi
            verify_remote_annotated_tag
            echo "verified remote annotated tag at candidate source: $release_tag"
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            test "$RELEASE_MODE" = publish
            echo "resuming or verifying the existing release: $release_tag"
          fi
          {
            printf 'source_sha=%s\n' "$candidate_sha"
            printf 'release_tag=%s\n' "$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact candidate from the verified run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kessoku-release-candidate-${{ steps.guard.outputs.source_sha }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Re-verify candidate identity and checksums
        env:
          SOURCE_SHA: ${{ steps.guard.outputs.source_sha }}
        run: |
          set -euo pipefail
          release_tag="$(sed -n 's/^release_tag: //p' RELEASE_STATUS)"
          test -s candidate/docker/release/kessoku-api
          chmod 0755 candidate/docker/release/kessoku-api
          test -s candidate/release-assets/VERSION.json
          grep -F '"version":"'"${release_tag#v}"'"' \
            candidate/release-assets/VERSION.json
          grep -F '"git_commit":"'"${SOURCE_SHA}"'"' \
            candidate/release-assets/VERSION.json
          grep -Fx "repository=${GITHUB_REPOSITORY}" \
            candidate/release-assets/BUILD-INPUTS.txt
          grep -Fx "source_commit=${SOURCE_SHA}" \
            candidate/release-assets/BUILD-INPUTS.txt
          grep -Fx "release_tag=${release_tag}" \
            candidate/release-assets/BUILD-INPUTS.txt
          grep -F $'\tpath\tgithub.com/q1ngyang/rustdesk-api-kessoku/v3/cmd' \
            candidate/release-assets/GO-BUILD-INFO.txt
          grep -F $'\tbuild\tvcs.revision='"${SOURCE_SHA}" \
            candidate/release-assets/GO-BUILD-INFO.txt
          grep -F $'\tbuild\tvcs.modified=false' \
            candidate/release-assets/GO-BUILD-INFO.txt
          test -s candidate/release-assets/ADMIN-WEB-DIST-SHA256SUMS
          test -s candidate/release-assets/kessoku-admin-web.cdx.json
          test -s candidate/release-assets/WEB-CLIENT-DIST-SHA256SUMS
          test -s candidate/release-assets/kessoku-web-client.cdx.json
          test -s candidate/release-assets/ADMIN-WEB-LICENSE
          test -s candidate/release-assets/WEB-CLIENT-LICENSE
          test -s candidate/release-assets/WEB-CLIENT-NOTICE.md
          test -s candidate/release-assets/config.docker-builtin.yaml
          cmp RELEASE_STATUS candidate/release-assets/RELEASE_STATUS
          cmp internal/starrycontrol/CONTRACT_VERSION \
            candidate/release-assets/CONTRACT_VERSION
          summary_path="$(sed -n 's/^release_summary_path: //p' \
            internal/starrycontrol/CONTRACT_VERSION)"
          test -s "$summary_path"
          cmp "$summary_path" \
            candidate/release-assets/STARRY-RELEASE-SUMMARY.json
          (cd candidate/release-assets && sha256sum --check SHA256SUMS)
          tar -tvzf candidate/release-assets/*.tar.gz release/kessoku-api \
            | grep -Eq '^-rwxr-xr-x '
          archive_binary="${RUNNER_TEMP}/candidate-kessoku-api"
          test ! -e "$archive_binary"
          tar -xOzf candidate/release-assets/*.tar.gz release/kessoku-api \
            > "$archive_binary"
          cmp "$archive_binary" candidate/docker/release/kessoku-api
          rm "$archive_binary"
          test -x candidate/docker/release/kessoku-api
          test -d candidate/docker/release/resources/admin
          test -s candidate/docker/release/resources/client/index.html
          test -s candidate/docker/release/resources/client/third-party-licenses/@bufbuild-protobuf-2.9.0.txt
          test ! -e candidate/docker/release/resources/web
          test ! -e candidate/docker/release/resources/web2

      - name: Sign build provenance for every candidate subject
        id: provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: candidate/release-assets/SHA256SUMS

      - name: Sign the candidate SBOM assertion
        id: sbom-attestation
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-checksums: candidate/release-assets/SHA256SUMS
          sbom-path: candidate/release-assets/kessoku-candidate.spdx.json

      - name: Attach portable Sigstore bundles and refresh checksums
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" \
            candidate/release-assets/BUILD-PROVENANCE.sigstore.json
          cp "$SBOM_BUNDLE" \
            candidate/release-assets/SBOM-ATTESTATION.sigstore.json
          (
            cd candidate/release-assets
            checksums="$(mktemp)"
            find . -maxdepth 1 -type f ! -name SHA256SUMS \
              -printf '%f\0' | LC_ALL=C sort -z | xargs -0 sha256sum -- \
              > "$checksums"
            mv "$checksums" SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push commit-addressed candidate image before tagging
        if: inputs.mode == 'prepare'
        id: candidate-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: candidate/docker
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:candidate-${{ steps.guard.outputs.source_sha }}
          labels: |
            org.opencontainers.image.title=rustdesk-api-kessoku
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ env.RELEASE_TAG }}/docs/deployment/CONTAINER.md
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ steps.guard.outputs.source_sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Kessoku RustDesk administration API with Starry control and a Relay-only WebClient
          annotations: |
            index:org.opencontainers.image.title=rustdesk-api-kessoku
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.url=https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
            index:org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ env.RELEASE_TAG }}/docs/deployment/CONTAINER.md
            index:org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            index:org.opencontainers.image.revision=${{ steps.guard.outputs.source_sha }}
            index:org.opencontainers.image.licenses=MIT
            index:org.opencontainers.image.description=Kessoku RustDesk administration API with Starry control and a Relay-only WebClient

      - name: Verify the pushed candidate image before tagging
        if: inputs.mode == 'prepare'
        env:
          PUSHED_DIGEST: ${{ steps.candidate-image.outputs.digest }}
          SOURCE_SHA: ${{ steps.guard.outputs.source_sha }}
        run: |
          set -euo pipefail
          candidate_ref="${IMAGE_NAME}:candidate-${SOURCE_SHA}"
          printf '%s' "$PUSHED_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          registry_digest="$(docker buildx imagetools inspect "$candidate_ref" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          test "$registry_digest" = "$PUSHED_DIGEST"

      - name: Prepare concise release notes
        run: |
          set -euo pipefail
          release_tag="$(sed -n 's/^release_tag: //p' RELEASE_STATUS)"
          notes_file="docs/releases/${release_tag}/RELEASE-NOTES-${release_tag}.md"
          chinese_notes="docs/releases/${release_tag}/RELEASE-NOTES-${release_tag}.zh-CN.md"
          migration_file="docs/releases/${release_tag}/MIGRATION-${release_tag}.md"
          test -f "$notes_file"
          test -f "$chinese_notes"
          test -f "$migration_file"
          cat > release-notes.md <<EOF
          # Kessoku ${release_tag}

          - Adds stable JSON version, configuration, database-status, and explicit-migration commands for S6.
          - Adds local-only audited administrator recovery and per-user 2FA reset with session revocation.
          - Adds race-safe Presence Lease v2 while retaining the legacy heartbeat API.
          - Advances database schema 312 to 313 with serialized migration and duplicate-ID preflight.
          - Requires Starry 1.1.16-patch-v1.3.0 for verified activation routes.
          - Image: ghcr.io/${GITHUB_REPOSITORY}:${release_tag}; latest is updated to this release.
          - Platform: linux/amd64. Pin the versioned image digest in production.
          - Verify assets with SHA256SUMS and the attached Sigstore provenance/SBOM.
          - [Read more](https://github.com/${GITHUB_REPOSITORY}/blob/${release_tag}/${notes_file}) · [中文说明](https://github.com/${GITHUB_REPOSITORY}/blob/${release_tag}/${chinese_notes}) · [Upgrade guide](https://github.com/${GITHUB_REPOSITORY}/blob/${release_tag}/${migration_file})
          EOF
          test "$(wc -l < release-notes.md)" -le 12

      - name: Create immutable tag after every pre-publication gate
        if: inputs.mode == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.guard.outputs.source_sha }}
        run: |
          set -euo pipefail
          release_tag="$(sed -n 's/^release_tag: //p' RELEASE_STATUS)"
          if tag_object_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" \
            --jq .object.sha 2>/dev/null)"; then
            test "$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" \
              --jq .object.type)" = tag
            test "$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq .tag)" = "$release_tag"
            test "$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq .object.type)" = commit
            test "$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq .object.sha)" = "$SOURCE_SHA"
            echo "exact annotated tag already exists: $release_tag"
            exit 0
          fi
          tag_object_sha="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$release_tag" \
            -f message="rustdesk-api-kessoku ${release_tag}" \
            -f object="$SOURCE_SHA" \
            -f type=commit --jq .sha)"
          printf '%s' "$tag_object_sha" | grep -Eq '^[0-9a-f]{40}$'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${release_tag}" -f sha="$tag_object_sha" \
            --jq .ref | grep -Fx "refs/tags/${release_tag}"

      - name: Promote the exact candidate image to versioned and stable tags
        if: inputs.mode == 'publish'
        env:
          SOURCE_SHA: ${{ steps.guard.outputs.source_sha }}
        run: |
          set -euo pipefail
          candidate_ref="${IMAGE_NAME}:candidate-${SOURCE_SHA}"
          version_ref="${IMAGE_NAME}:${RELEASE_TAG}"
          stable_ref="${IMAGE_NAME}:latest"
          candidate_digest="$(docker buildx imagetools inspect "$candidate_ref" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          printf '%s' "$candidate_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          docker buildx imagetools create --tag "$version_ref" \
            --tag "$stable_ref" "$candidate_ref"
          version_digest="$(docker buildx imagetools inspect "$version_ref" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          stable_digest="$(docker buildx imagetools inspect "$stable_ref" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          test "$version_digest" = "$candidate_digest"
          test "$stable_digest" = "$candidate_digest"

      - name: Publish immutable GitHub release assets
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.guard.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.guard.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(wc -l < release-notes.md)" -le 12
          release_title="rustdesk-api-kessoku $RELEASE_TAG"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --target "$SOURCE_SHA" --title "$release_title" \
              --notes-file release-notes.md
          fi

          test "$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)" \
            = "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --json targetCommitish \
            --jq .targetCommitish)" = "$SOURCE_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease \
            --jq .isPrerelease)" = false
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          printf '%s' "$is_draft" | grep -Eq '^(true|false)$'

          if [ "$is_draft" = true ]; then
            gh release edit "$RELEASE_TAG" --draft --verify-tag \
              --target "$SOURCE_SHA" --title "$release_title" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" candidate/release-assets/* --clobber
          fi

          test "$(gh release view "$RELEASE_TAG" --json name --jq .name)" \
            = "$release_title"
          remote_body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
          local_body="$(cat release-notes.md)"
          test "$remote_body" = "$local_body"

          expected_assets="${RUNNER_TEMP}/expected-release-assets.txt"
          actual_assets="${RUNNER_TEMP}/actual-release-assets.txt"
          find candidate/release-assets -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > "$expected_assets"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort > "$actual_assets"
          diff -u "$expected_assets" "$actual_assets"

          downloaded_assets="${RUNNER_TEMP}/downloaded-release-assets"
          mkdir -p "$downloaded_assets"
          gh release download "$RELEASE_TAG" --dir "$downloaded_assets"
          cmp candidate/release-assets/SHA256SUMS \
            "$downloaded_assets/SHA256SUMS"
          (cd "$downloaded_assets" && sha256sum --check SHA256SUMS)

          if [ "$is_draft" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" \
            = false
