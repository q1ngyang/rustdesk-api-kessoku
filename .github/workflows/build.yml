name: Release candidate (non-publishing)

on:
  workflow_dispatch:

# This workflow can only create short-lived Actions artifacts. RELEASE_STATUS,
# the immutable Starry contract, and the embedded reviewed admin-web source all fail
# closed before a complete candidate can be assembled.
permissions:
  contents: read

concurrency:
  group: kessoku-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  DEBIAN_TEST_IMAGE: debian:bookworm-slim@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241
  GO_VERSION: 1.26.6
  NODE_VERSION: 24.15.0
  NPM_VERSION: 11.12.1

jobs:
  build:
    name: Verify source and build Linux amd64 runtime
    runs-on: ubuntu-24.04
    container:
      image: golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36
    timeout-minutes: 60
    outputs:
      artifact_label: ${{ steps.version.outputs.artifact_label }}
      deb_version: ${{ steps.version.outputs.deb_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    services:
      postgres:
        image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
        env:
          POSTGRES_USER: kessoku
          POSTGRES_PASSWORD: kessoku-test-password
          POSTGRES_DB: kessoku_test_migration
        options: >-
          --health-cmd "pg_isready -U kessoku -d kessoku_test_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4.2@sha256:ac80b6e09e5b12b4f9d5cd4f6425e43464247aa4ba4f6169da5daf59e5877f7d
        env:
          MYSQL_ROOT_PASSWORD: kessoku-test-password
          MYSQL_DATABASE: kessoku_test_migration
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pkessoku-test-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      KESSOKU_TEST_POSTGRES_DSN: "host=postgres port=5432 user=kessoku password=kessoku-test-password dbname=kessoku_test_migration sslmode=disable TimeZone=UTC"
      KESSOKU_TEST_MYSQL_DSN: "root:kessoku-test-password@tcp(mysql:3306)/kessoku_test_migration?charset=utf8mb4&parseTime=True&loc=UTC"
    steps:
      - name: Checkout backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve fail-closed candidate version
        id: version
        run: |
          set -euo pipefail
          status="$(sed -n 's/^status: //p' RELEASE_STATUS)"
          release_tag="$(sed -n 's/^release_tag: //p' RELEASE_STATUS)"
          keys="$(sed -n 's/^\([a-z_]*\): .*/\1/p' RELEASE_STATUS | LC_ALL=C sort | tr '\n' ' ')"
          test "$keys" = "release_tag status "
          printf '%s' "$status" | grep -Eq '^(BLOCKED|APPROVED)$'

          if [ "$release_tag" = UNSET ]; then
            test "$status" = BLOCKED
            artifact_label="candidate-$(printf '%.12s' "$GITHUB_SHA")"
            deb_version="0.0.0~${artifact_label}-1"
          else
            printf '%s' "$release_tag" \
              | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$'
            test "$release_tag" = v2.8.0
            artifact_label="$release_tag"
            deb_version="$(printf '%s' "${release_tag#v}" | tr '-' '~')-1"
          fi

          {
            echo "artifact_label=$artifact_label"
            echo "deb_version=$deb_version"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Kessoku candidate resolution"
            echo
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Candidate label: \`${artifact_label}\`"
            echo "- Configured release tag: \`${release_tag}\`"
            echo "- Publication gate: \`${status}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify pinned Starry contract provenance
        run: |
          grep -qx 'status: PINNED' internal/starrycontrol/CONTRACT_VERSION
          ! grep -Eq 'UNPUBLISHED|UNAVAILABLE' internal/starrycontrol/CONTRACT_VERSION

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            admin-web/package-lock.json
            web-client/package-lock.json

      - name: Verify embedded admin web
        working-directory: admin-web
        run: |
          set -euo pipefail
          test "$(npm --version)" = "${NPM_VERSION}"
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit signatures
          npm run lint
          npm test
          npm run build
          find dist -type f -print0 | LC_ALL=C sort -z \
            | xargs -0 sha256sum > "${RUNNER_TEMP}/admin-web-dist-1.sha256"
          npm run build
          find dist -type f -print0 | LC_ALL=C sort -z \
            | xargs -0 sha256sum > "${RUNNER_TEMP}/admin-web-dist-2.sha256"
          diff -u "${RUNNER_TEMP}/admin-web-dist-1.sha256" \
            "${RUNNER_TEMP}/admin-web-dist-2.sha256"
          npm sbom --omit=dev --sbom-format cyclonedx \
            > "${RUNNER_TEMP}/kessoku-admin-web.cdx.json"
          node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync(process.argv[1]));if(s.components.some(c=>!(c.licenses||[]).length))throw new Error("missing production licence metadata")' "${RUNNER_TEMP}/kessoku-admin-web.cdx.json"
          mkdir -p ../resources/admin
          cp -a dist/. ../resources/admin/

      - name: Verify embedded open-source web client
        working-directory: web-client
        run: |
          set -euo pipefail
          test "$(npm --version)" = "${NPM_VERSION}"
          npm ci
          npm audit --omit=dev --audit-level=high
          npm audit signatures
          npm run lint
          npm test
          npm run build
          test -s dist/third-party-licenses/@bufbuild-protobuf-2.9.0.txt
          find dist -type f -print0 | LC_ALL=C sort -z \
            | xargs -0 sha256sum > "${RUNNER_TEMP}/web-client-dist-1.sha256"
          npm run build
          find dist -type f -print0 | LC_ALL=C sort -z \
            | xargs -0 sha256sum > "${RUNNER_TEMP}/web-client-dist-2.sha256"
          diff -u "${RUNNER_TEMP}/web-client-dist-1.sha256" \
            "${RUNNER_TEMP}/web-client-dist-2.sha256"
          npm sbom --sbom-format cyclonedx \
            > "${RUNNER_TEMP}/kessoku-web-client.cdx.json"
          node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync(process.argv[1]));if(s.components.some(c=>!(c.licenses||[]).length))throw new Error("missing licence metadata");if(!s.components.some(c=>c.name==="@bufbuild/protobuf"&&c.version==="2.9.0"&&(c.licenses||[]).length))throw new Error("web client runtime dependency missing from SBOM")' "${RUNNER_TEMP}/kessoku-web-client.cdx.json"
          mkdir -p ../resources/client
          cp -a dist/. ../resources/client/
          test -s ../resources/client/third-party-licenses/@bufbuild-protobuf-2.9.0.txt

      - name: Verify locks, formatting, tests, races, and generated docs
        run: |
          set -euo pipefail
          test "$(go version | awk '{print $3}')" = "go${GO_VERSION}"
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
          test -z "$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)"
          go vet ./...
          go test -timeout=8m ./...
          go test -race -timeout=10m ./...
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          swag init -g cmd/apimain.go --output docs/api --instanceName api --exclude http/controller/admin
          swag init -g cmd/apimain.go --output docs/admin --instanceName admin --exclude http/controller/api
          git diff --exit-code -- docs

      - name: Build runtime tree
        env:
          ARTIFACT_LABEL: ${{ steps.version.outputs.artifact_label }}
          CGO_ENABLED: 1
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          binary_stage="${RUNNER_TEMP}/kessoku-build"
          test ! -e "$binary_stage"
          mkdir -p "$binary_stage"
          go build -trimpath -buildvcs=true -ldflags '-s -w' \
            -o "$binary_stage/kessoku-api" ./cmd
          go build -trimpath -buildvcs=true -ldflags '-s -w' \
            -o "$binary_stage/kessoku-api.rebuild" ./cmd
          cmp "$binary_stage/kessoku-api" \
            "$binary_stage/kessoku-api.rebuild"
          rm "$binary_stage/kessoku-api.rebuild"
          go version -m "$binary_stage/kessoku-api" \
            | tee "$binary_stage/GO-BUILD-INFO.txt"
          grep -F $'\tpath\tgithub.com/q1ngyang/rustdesk-api-kessoku/v2/cmd' \
            "$binary_stage/GO-BUILD-INFO.txt"
          grep -F $'\tbuild\tvcs=git' "$binary_stage/GO-BUILD-INFO.txt"
          grep -F $'\tbuild\tvcs.revision='"${GITHUB_SHA}" \
            "$binary_stage/GO-BUILD-INFO.txt"
          grep -F $'\tbuild\tvcs.modified=false' \
            "$binary_stage/GO-BUILD-INFO.txt"

          mkdir -p candidate/release/data candidate/release/runtime
          install -m 0644 "${RUNNER_TEMP}/admin-web-dist-2.sha256" \
            candidate/ADMIN-WEB-DIST-SHA256SUMS
          install -m 0644 "${RUNNER_TEMP}/kessoku-admin-web.cdx.json" \
            candidate/kessoku-admin-web.cdx.json
          install -m 0644 "${RUNNER_TEMP}/web-client-dist-2.sha256" \
            candidate/WEB-CLIENT-DIST-SHA256SUMS
          install -m 0644 "${RUNNER_TEMP}/kessoku-web-client.cdx.json" \
            candidate/kessoku-web-client.cdx.json
          install -m 0644 admin-web/LICENSE candidate/ADMIN-WEB-LICENSE
          install -m 0644 web-client/LICENSE candidate/WEB-CLIENT-LICENSE
          install -m 0644 web-client/NOTICE.md candidate/WEB-CLIENT-NOTICE.md
          install -m 0755 "$binary_stage/kessoku-api" \
            candidate/release/kessoku-api
          install -m 0644 "$binary_stage/GO-BUILD-INFO.txt" \
            candidate/GO-BUILD-INFO.txt
          sh scripts/copy-runtime-resources.sh \
            candidate/release/resources resources require-admin require-client
          printf '%s\n' "$ARTIFACT_LABEL" > candidate/release/resources/version
          cp -a conf docs candidate/release/
          cp -a README.md README.zh-CN.md README_EN.md CONTAINER.md \
            CONTAINER.zh-CN.md RELEASE-NOTES-v2.8.0.md \
            RELEASE-NOTES-v2.8.0.zh-CN.md SECURITY-MODEL.md MIGRATION.md \
            OPERATOR-RUNBOOK.md ROLLBACK-RUNBOOK.md WEB-CLIENT.md \
            WEB-CLIENT.zh-CN.md \
            ADMIN-WEB-PROVENANCE.md RELEASE-CHECKLIST.md RELEASE-PROCESS.md \
            RELEASE_STATUS LICENSE \
            candidate/release/
          install -m 0644 admin-web/LICENSE \
            candidate/release/ADMIN-WEB-LICENSE
          install -m 0644 web-client/LICENSE candidate/release/WEB-CLIENT-LICENSE
          install -m 0644 web-client/NOTICE.md candidate/release/WEB-CLIENT-NOTICE.md
          test ! -e candidate/release/resources/web
          test ! -e candidate/release/resources/web2
          test -s candidate/release/resources/client/index.html
          test -s candidate/release/resources/client/third-party-licenses/@bufbuild-protobuf-2.9.0.txt
          cat > candidate/BUILD-INPUTS.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          source_commit=${GITHUB_SHA}
          release_tag=${RELEASE_TAG}
          artifact_label=${ARTIFACT_LABEL}
          go_version=${GO_VERSION}
          admin_web_path=admin-web
          admin_web_source_commit=${GITHUB_SHA}
          admin_web_import_commit=2a9d037fc271cf96b39fd4add4b97c4ff4477f12
          admin_web_seed_commit=3998c2a9213fcd047252776d0f0db33e6717026c
          web_client_path=web-client
          web_client_source_commit=${GITHUB_SHA}
          web_client_license=MIT
          EOF

      - name: Scan source and runtime dependencies
        run: |
          set -euo pipefail
          sh scripts/install-ci-tools.sh "${RUNNER_TEMP}/kessoku-tools"
          "${RUNNER_TEMP}/kessoku-tools/actionlint"
          "${RUNNER_TEMP}/kessoku-tools/gitleaks" git . \
            --redact --no-banner --exit-code 1
          "${RUNNER_TEMP}/kessoku-tools/gitleaks" dir candidate/release \
            --redact --no-banner --exit-code 1
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          mkdir source-sbom-input
          git archive HEAD | tar -x -C source-sbom-input
          "${RUNNER_TEMP}/kessoku-tools/syft" scan dir:source-sbom-input \
            -o spdx-json=candidate/kessoku-source.spdx.json
          "${RUNNER_TEMP}/kessoku-tools/syft" scan dir:candidate/release \
            -o spdx-json=candidate/kessoku-runtime.spdx.json

      - name: Upload verified runtime tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kessoku-runtime-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: true
          path: candidate/

  package:
    name: Build amd64 Debian package
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kessoku-runtime-${{ github.sha }}
          path: runtime

      - name: Build and inspect Debian package
        env:
          DEB_VERSION: ${{ needs.build.outputs.deb_version }}
        run: |
          set -euo pipefail
          scripts/build-deb.sh runtime/release "$DEB_VERSION" amd64 packages
          test "$(find packages -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          dpkg-deb --info packages/*.deb
          dpkg-deb --contents packages/*.deb
          ! dpkg-deb --contents packages/*.deb | grep -Eq '/resources/(web|web2)/'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kessoku-deb-amd64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: true
          path: packages/*.deb

  image-test:
    name: Build and smoke-test candidate image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify bilingual docs and recommended Compose
        run: |
          python3 scripts/check_docs.py
          docker compose --env-file examples/compose.env.example \
            -f docker-compose.yaml config
          docker compose --env-file examples/compose.env.example \
            -f docker-compose.yaml config --quiet

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kessoku-runtime-${{ github.sha }}
          path: runtime

      - name: Build and smoke-test unprivileged image
        run: |
          set -euo pipefail
          mkdir docker-context
          cp Dockerfile docker-context/Dockerfile
          cp -a runtime/release docker-context/release
          docker build --tag kessoku-candidate:amd64 docker-context
          test "$(docker image inspect --format '{{.Config.User}}' kessoku-candidate:amd64)" = "65534:65534"
          docker run --rm kessoku-candidate:amd64 ./kessoku-api --help
          docker run --rm kessoku-candidate:amd64 sh -c \
            'test ! -e resources/web && test ! -e resources/web2 && test -s resources/admin/index.html && test -s resources/client/index.html && test -s resources/client/third-party-licenses/@bufbuild-protobuf-2.9.0.txt'

  package-test:
    name: Install and run candidate Debian package
    needs:
      - build
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kessoku-deb-amd64-${{ github.sha }}
          path: packages

      - name: Install package in a digest-pinned Debian environment
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -v "${PWD}/packages:/packages:ro" \
            "${DEBIAN_TEST_IMAGE}" sh -euxc '
              printf "#!/bin/sh\nexit 101\n" > /usr/sbin/policy-rc.d
              chmod 0755 /usr/sbin/policy-rc.d
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/*.deb
              test "$(id -un kessoku-api)" = kessoku-api
              test "$(stat -c %a /var/lib/kessoku-api/data)" = 700
              test "$(stat -c %a /var/lib/kessoku-api/runtime)" = 700
              test ! -e /var/lib/kessoku-api/resources/web
              test ! -e /var/lib/kessoku-api/resources/web2
              test -d /var/lib/kessoku-api/resources/admin
              test -s /var/lib/kessoku-api/resources/client/index.html
              test -s /var/lib/kessoku-api/resources/client/third-party-licenses/@bufbuild-protobuf-2.9.0.txt
              /usr/bin/kessoku-api --help
            '

  candidate:
    name: Assemble final auditable candidate
    needs:
      - build
      - package
      - image-test
      - package-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kessoku-runtime-${{ github.sha }}
          path: runtime

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kessoku-deb-amd64-${{ github.sha }}
          path: packages

      - name: Assemble exact archive, package, and image context
        env:
          ARTIFACT_LABEL: ${{ needs.build.outputs.artifact_label }}
        run: |
          set -euo pipefail
          mkdir -p candidate/docker candidate/release-assets
          cp Dockerfile candidate/docker/Dockerfile
          cp -a runtime/release candidate/docker/release
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner -C runtime -cf - release \
            | gzip -n > \
              "candidate/release-assets/kessoku-${ARTIFACT_LABEL}-linux-amd64.tar.gz"
          cp packages/*.deb candidate/release-assets/
          cp runtime/BUILD-INPUTS.txt runtime/GO-BUILD-INFO.txt \
            runtime/ADMIN-WEB-DIST-SHA256SUMS \
            runtime/WEB-CLIENT-DIST-SHA256SUMS \
            runtime/ADMIN-WEB-LICENSE runtime/WEB-CLIENT-LICENSE \
            runtime/WEB-CLIENT-NOTICE.md \
            runtime/kessoku-admin-web.cdx.json \
            runtime/kessoku-web-client.cdx.json \
            runtime/kessoku-source.spdx.json \
            runtime/kessoku-runtime.spdx.json candidate/release-assets/
          cp RELEASE_STATUS RELEASE-CHECKLIST.md RELEASE-PROCESS.md \
            internal/starrycontrol/CONTRACT_VERSION candidate/release-assets/
          cp CONTAINER.md CONTAINER.zh-CN.md RELEASE-NOTES-v2.8.0.md \
            RELEASE-NOTES-v2.8.0.zh-CN.md docker-compose.yaml \
            candidate/release-assets/
          cp examples/compose.env.example \
            candidate/release-assets/compose.env.example
          cp examples/config.docker-builtin.yaml \
            candidate/release-assets/config.docker-builtin.yaml

      - name: Generate candidate-filesystem SBOM and checksums
        run: |
          set -euo pipefail
          sh scripts/install-ci-tools.sh "${RUNNER_TEMP}/kessoku-tools"
          "${RUNNER_TEMP}/kessoku-tools/syft" scan \
            dir:candidate/release-assets \
            -o spdx-json=candidate/kessoku-candidate.spdx.json
          mv candidate/kessoku-candidate.spdx.json candidate/release-assets/
          (
            cd candidate/release-assets
            checksums="$(mktemp)"
            find . -maxdepth 1 -type f ! -name SHA256SUMS \
              -printf '%f\0' | LC_ALL=C sort -z | xargs -0 sha256sum -- \
              > "$checksums"
            mv "$checksums" SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Reject forbidden or incomplete candidate contents
        run: |
          set -euo pipefail
          test -s candidate/release-assets/SHA256SUMS
          test -s candidate/release-assets/GO-BUILD-INFO.txt
          test -s candidate/release-assets/ADMIN-WEB-DIST-SHA256SUMS
          test -s candidate/release-assets/kessoku-admin-web.cdx.json
          test -s candidate/release-assets/WEB-CLIENT-DIST-SHA256SUMS
          test -s candidate/release-assets/kessoku-web-client.cdx.json
          test -s candidate/release-assets/ADMIN-WEB-LICENSE
          test -s candidate/release-assets/WEB-CLIENT-LICENSE
          test -s candidate/release-assets/WEB-CLIENT-NOTICE.md
          test -s candidate/release-assets/config.docker-builtin.yaml
          test -s candidate/release-assets/kessoku-source.spdx.json
          test -s candidate/release-assets/kessoku-runtime.spdx.json
          test -s candidate/release-assets/kessoku-candidate.spdx.json
          test "$(find candidate/release-assets -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find candidate/release-assets -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test -x candidate/docker/release/kessoku-api
          test -d candidate/docker/release/resources/admin
          test -s candidate/docker/release/resources/client/index.html
          test -s candidate/docker/release/resources/client/third-party-licenses/@bufbuild-protobuf-2.9.0.txt
          test ! -e candidate/docker/release/resources/web
          test ! -e candidate/docker/release/resources/web2
          if tar -tzf candidate/release-assets/*.tar.gz \
            | grep -Eq '(^|/)(web|web2)/'; then
            echo "browser-client directory entered archive" >&2
            exit 1
          fi
          if dpkg-deb --contents candidate/release-assets/*.deb \
            | grep -Eq '/resources/(web|web2)/'; then
            echo "browser-client directory entered Debian package" >&2
            exit 1
          fi
          ! find candidate -type f \
            \( -name '*.key' -o -name '*.pem' -o -name '*.p12' \) -print -quit \
            | grep -q .

      - name: Upload complete non-publishing candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kessoku-release-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
          path: candidate/
