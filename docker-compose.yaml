services:
  kessoku-api:
    image: ${KESSOKU_IMAGE:-ghcr.io/q1ngyang/rustdesk-api-kessoku:v3.0.6}
    container_name: rustdesk-api-kessoku
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RUSTDESK_API_LANG: ${KESSOKU_LANG:-zh-CN}
      RUSTDESK_API_RUSTDESK_ID_SERVER: ${RUSTDESK_ID_SERVER:?set RUSTDESK_ID_SERVER}
      RUSTDESK_API_RUSTDESK_RELAY_SERVER: ${RUSTDESK_RELAY_SERVER:?set RUSTDESK_RELAY_SERVER}
      RUSTDESK_API_RUSTDESK_API_SERVER: ${KESSOKU_PUBLIC_URL:?set KESSOKU_PUBLIC_URL}
      RUSTDESK_API_RUSTDESK_KEY: ${RUSTDESK_SERVER_PUBLIC_KEY:?set RUSTDESK_SERVER_PUBLIC_KEY}
      RUSTDESK_API_GIN_TRUST_PROXY: ${KESSOKU_TRUST_PROXY:-}
    ports:
      - ${KESSOKU_BIND_ADDRESS:-127.0.0.1}:${KESSOKU_API_PORT:-21114}:21114
      - ${KESSOKU_CLIENT_BIND_ADDRESS:-127.0.0.1}:${KESSOKU_CLIENT_PORT:-21122}:21122
    volumes:
      - ${KESSOKU_DATA_DIR:-./data/kessoku}:/app/data
      - ${KESSOKU_SECRETS_DIR:-./secrets}:/run/secrets:ro
      # relay-wss-urls is an exact YAML map and is deliberately not decoded
      # from an environment variable.
      - ${KESSOKU_CONFIG_FILE:-./config.yaml}:/app/conf/config.yaml:ro
    tmpfs:
      - /app/runtime:uid=65534,gid=65534,mode=0700
